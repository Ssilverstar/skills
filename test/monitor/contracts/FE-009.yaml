schema_version: 1
task_id: FE-009
objective: "스킬 뷰 MCP 대시보드·상태 표(snapshot.mcp, api.md v2.4) + FE-008 영어 모드 정적 문구 반송 수정"
worker_role: frontend-builder
preferred_model: "Antigravity Gemini 3.8 Flash (herdr agent gemini-monitor, w3:pB)"
depends_on: [FE-008]
pre_handoff_state: "FE-008 채택 후 상태. FE-008의 MCP 빈 상태 카드를 실제 표시로 교체"
inputs: {api_contracts: ["test/monitor/contracts/api.md  # v2.4 snapshot.mcp 절"]}
file_ownership:
  allowed: ["test/monitor/app/static/**", "test/monitor/tests/ui/**  # integration.test.js 제외", "test/monitor/contracts/results/FE-009.yaml"]
  prohibited: ["test/monitor/tests/ui/integration.test.js", "test/monitor/app/server.py", "test/monitor/host_probe.py", "test/monitor/*.yaml", "test/monitor/contracts/api.md", "설정·전역 파일", "git commit/push"]
acceptance_criteria:
  - "AC1 MCP 요약 타일(에이전트당 1개): 공통 설정 수(common_configured_count / common_servers 길이, 예 3/3), 공통 connected 수, 플랫폼 추가(scope=platform) 수를 각각 별도 표시하고 서로 더하지 않음. error 수가 있으면 상태 아이콘+라벨(critical)로 강조"
  - "AC2 MCP 상태 표(에이전트 × 서버 행, 정렬 가능, sticky 헤더): 서버 이름·범위(공통/플랫폼)·설정·활성·상태(connected=연결 확인/configured=설정만 확인/error=오류/unverified=미확인, 상태색은 아이콘·라벨과 함께)·도구 수(null=미확인)·확인 시각(상대+툴팁 절대)·note(영어 원문)"
  - "AC3 snapshot.mcp 없음 → 'MCP 미확인'/'MCP unknown' 빈 상태. 특정 에이전트 항목 없음 → 그 타일에 미확인. 0으로 표시 금지. 알 수 없는 status 문자열은 textContent로 그대로"
  - "AC4 스킬 분류(공통 선택/공통 발견/공통 활성 확인/플랫폼 추가/비활성/미확인)와 MCP 수를 섞지 않음. 영어 모드 한글 0건 유지, ko/en·주간/야간·390px·CSP·textContent 회귀 없음"
  - "AC5 순수 함수 export + 테스트: MCP 요약 계수(공통/플랫폼 분리·connected·error·누락), 상태 라벨 매핑(ko/en, 미지 값 통과), mcp 누락 처리"
  - "AC6 (FE-008 AC4 미충족 반송) 실제 브라우저 영어 모드에서 보이는 한글이 남음(Claude 스캔 test/.local/ignored/claude-langscan/fe008.json): index.html 정적 문구(h3.block-title·p.block-desc·span.chart-title·h4.notes-title 등), aria-label('주 메뉴','언어 전환','테마 전환','조회 시간 범위'), 언어 버튼 텍스트('한국어' → 영어 모드에서는 'Korean'), 표 셀 '세션 누적 · 모델별 분해 미지원'. index.html의 모든 사용자 노출 문자열·aria-label·title·placeholder를 data-i18n 키로 바꾸고 언어 전환 시 일괄 적용(초기 렌더 포함). index.html의 한글 문자열 목록과 I18N.en 키 대응을 검사하는 테스트 추가(정적 HTML을 문자열로 읽어 data-i18n 없는 한글 텍스트 0건)"
  - "AC7 (추가 요청) 스킬 분류는 프로브 skills.agents[].common_enabled_count·platform_extra_count가 있으면 그 값을 우선 사용(api.md v2.5), 없을 때만 목록 계산. Claude humanize 보조 3 같은 공통 밖 활성분은 플랫폼 추가로만. MCP connected 라벨은 '연결 확인(디스커버리)'/'Connected (discovery)'로, '사용 가능'으로 단정 금지. 새 MCP 표·스킬 분류 표의 정렬·키보드(Enter/Space, aria-sort, sticky)는 기존 표와 동일 기준. 영어 모드 언어 버튼은 'Korean'"
mandatory_checks:
  - "node --check test/monitor/app/static/app.js"
  - "node --test test/monitor/tests/ui/*.test.js   # stderr 비어 있어야 함"
rules: ["셸 명령은 한 줄만, 같은 검사 반복 금지, 다른 디렉터리 탐색 금지", "결과 작성 후 추가 탐색 없이 'RESULT: <status> results/FE-009.yaml'"]
result_format: "FE-001.yaml result_format과 동일(task_id: FE-009)"
