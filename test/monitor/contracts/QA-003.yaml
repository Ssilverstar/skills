schema_version: 1
project: agent-observatory
task_id: QA-003
objective: "FE-008·FE-009(대시보드·스킬 분류·MCP·영어 전용) 회귀 QA + 실제 브라우저 DOM 영어 모드 한글 검사"
worker_role: test-engineer
preferred_model: "OpenCode Qwen3.8-Flash-Next-IQ3_S (herdr agent monitor-agents, w3:pA)"
depends_on: [FE-008, FE-009]
pre_handoff_state: "FE-008·FE-009 반영 후 Claude가 앱 컨테이너 재빌드 완료(http://127.0.0.1:8787). 코드는 읽기만"
inputs:
  api_contracts: ["test/monitor/contracts/api.md", "test/monitor/contracts/FE-008.yaml  # AC1~AC6"]
file_ownership:
  allowed:
    - "test/monitor/tests/lang_dom_check.py  # 신규"
    - "test/monitor/contracts/results/QA-003.md"
    - "test/.local/ignored/qa003/**  # 스크린샷·원시 출력"
  prohibited: ["test/monitor/app/**  # 결함은 고치지 말고 보고", "test/monitor/tests/test_*.py", "test/monitor/tests/ui/**", "test/monitor/host_probe.py", "설정·전역 파일", "컨테이너 재시작", "git commit/push"]
steps:
  - "회귀: cd test && .local/monitor-venv/bin/python -W error -m unittest discover -s monitor/tests 2>&1 | tail -3   (OK + stderr에 Warning 0)"
  - "회귀: cd test/monitor && node --test tests/ui/*.test.js   (fail 0, stderr 비어 있음)"
  - "DOM 검사 스크립트 tests/lang_dom_check.py 작성 후 실행: cd test/monitor && uv run --with playwright==1.63.0 python tests/lang_dom_check.py"
dom_check_spec:
  - "Chromium headless(이미 설치된 ~/.cache/ms-playwright 사용, 설치 명령 금지), viewport 1440x1000과 390x844 두 번"
  - "언어 토글을 화면의 실제 버튼으로 영어로 바꾼 뒤 #agents, #hardware, #skills 세 뷰를 해시로 차례로 열고, 각 뷰에서 모든 <details>를 open, 차트 범위 버튼(1h/6h/24h/7d) 하나 이상 클릭, 표 헤더 정렬 버튼 하나 클릭"
  - "각 뷰마다 document.body.innerText와 모든 요소의 title/aria-label/placeholder/alt 속성, document.title을 모아 /[가-힣]/ 일치 항목을 수집. 일치 0건이어야 통과. 실패 시 (뷰, 요소 selector 일부, 문자열 앞 60자)를 최대 50건 기록"
  - "한국어 모드로 되돌려 한글이 실제로 보이는지(>0) 확인(토글 동작 확인용)"
  - "390px에서 document.documentElement.scrollWidth <= innerWidth(가로 스크롤 없음)"
  - "(추가, 루트 E2E 결함 회귀) #skills의 MCP 요약 카드(.mcp-summary-grid의 직계 자식)가 정확히 4개이고 이름이 codex/claude/opencode/antigravity(대소문자 무시)이며 gemini 카드가 없음"
  - "(추가, 루트 E2E 결함 회귀) 수집 대상에 닫힌 <select>의 <option> 텍스트도 포함. 한국어로 로드 → 영어 전환 순서로 검사(초기 렌더 후 전환 시 남는 문자열 확인). #filter-skill-agent에서 value=__repository__ 선택 시 표 행이 1개 이상이고 옵션 라벨이 'Repository Origin'"
  - "콘솔 error/pageerror 0건. 스크린샷은 test/.local/ignored/qa003/에만"
  - "스크립트는 결과를 JSON 한 줄로 출력하고 실패가 있으면 exit 1"
rules: ["셸 명령은 한 줄씩, 같은 검사 반복 금지, 지정 외 디렉터리 탐색 금지", "새 의존성 설치·전역 설정 변경 금지(uv run --with 임시 환경만)", "끝나면 results/QA-003.md(명령·exit·통과/실패 수·DOM 한글 일치 목록·결함)를 쓰고 'RESULT: <pass|fail> results/QA-003.md'"]
