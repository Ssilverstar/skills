schema_version: 1
project: agent-observatory
task_id: FE-001
objective: "한국어 다크 UI 프런트엔드(좌측 메뉴 3개) 구현"
worker_role: frontend-builder
preferred_model: "Antigravity Gemini 3.8 (herdr agent gemini-monitor, w3:pB)"
base_commit: "f72a37d (test/는 미추적, 커밋 금지)"
worktree: "/home/hori/AI/skills (공유 트리, 파일 소유권으로 분리)"
pre_handoff_state: "app/static/ 디렉터리 없음. Claude가 쓴 프런트엔드 파일 없음(신규 작성). server.py가 /, /static/app.js, /static/style.css만 제공"
inputs:
  requirements: ["test/monitor-brief.md (품질 요구사항 절)"]
  api_contracts: ["test/monitor/contracts/api.md  # 의미 규칙 1~9는 필수"]
  real_data: ["test/.local/monitor/snapshot.json  # 읽기만"]
  server: ["test/monitor/app/server.py  # 읽기만"]
dependencies: [CONTRACT-001]
file_ownership:
  allowed:
    - "test/monitor/app/static/index.html"
    - "test/monitor/app/static/style.css"
    - "test/monitor/app/static/app.js"
    - "test/monitor/tests/ui/**"
    - "test/monitor/contracts/results/FE-001.yaml"
  prohibited:
    - "test/monitor/app/server.py"
    - "test/monitor/host_probe.py"
    - "test/monitor/contracts/api.md"
    - "test/monitor/tests/test_server.py"
    - "test/.local/monitor/**"
    - "그 외 모든 파일, git commit/push, 전역 설정"
design_rules:
  - "의존성·빌드 도구·CDN·외부 폰트 없음. 바닐라 JS 1파일(app.js) + CSS 1파일. CSP상 인라인 script/style/style 속성 금지(SVG 속성은 허용)"
  - "다크 토큰: bg #121211, surface #1a1a19, surface-2 #232321, border #33322f, text #f0efec/#c3c2b7/#8f8e86, series #3987e5, 상태 good #0ca30c warning #fab219 serious #ec835a critical #d03b3b (상태색은 아이콘/라벨과 함께, 시리즈용 재사용 금지)"
  - "차트: 인라인 SVG 단일 시리즈 small multiples(이중 축 금지), 2px 선, null은 선을 끊음(0으로 그리지 않음), 호버 십자선+툴팁, 차트 데이터는 표로도 제공"
  - "app.js 순수 함수(포맷·판정·경로 계산)는 브라우저 전역을 쓰지 않게 분리하고 파일 끝에서 `if (typeof module !== 'undefined') module.exports = {...}`로 노출"
acceptance_criteria:
  - "AC1 좌측 내비 3개: 에이전트 사용량(#agents) / 하드웨어·추론(#hardware) / 스킬 현황(#skills). 해시 라우팅, aria-current. 760px 이하에서 상단 가로 메뉴로 전환, 가로 스크롤 없음(표는 자체 스크롤)"
  - "AC2 상단 상태: waiting=수집 대기 빈 화면 안내, ok=정상, stale=지연 경고 배너, source=history=이력 복원 표시, error 표시. collected_at과 경과 시간 표시. 15초마다 /api/snapshot 재조회"
  - "AC3 에이전트: 4개 카드(이름·상태·모델·플랜명·한도 막대(used_percent, reset_at)·출처·관측 시각·이력 표시·notes). 토큰 표: 입력(캐시 포함)/캐시 읽기/캐시 쓰기/출력/추론(출력 포함)/합계/세션 — api.md 규칙 2·3·4 준수, null=미확인"
  - "AC4 모델별 사용량 표: 에이전트·모델·입력·캐시 읽기·캐시 쓰기·출력·합계·세션, 에이전트 내 합계 비중 막대. 모델 행을 더한 합계 행 금지"
  - "AC5 하드웨어: 호스트(CPU%, 메모리 used/total·%, 아키텍처·커널), GPU(이름·드라이버·사용률·온도·전력/한도·메모리=N/A 통합 메모리+memory_note), 추론 서버(endpoint·도달 여부·모델·engine·version·추가 스칼라 필드 개별 행). 범위 버튼 1h/6h/24h/7d → /api/history 그래프 4개(GPU 사용률, GPU 온도, GPU 전력, 호스트 메모리 %) + 스냅샷 이력 표(최근 50개, 보존 기간/최대 행 표시)"
  - "AC6 스킬: 에이전트별 요약 카드(installed/enabled/source/observed_at), 검색(이름·설명·경로) + 에이전트 필터, 표(이름·에이전트·활성·호출 요청 증거·마지막 사용·경로·출처). invocations null=미계측(usage_evidence 툴팁/보조줄). skills.notes 표시. compacted=true면 '목록 로딩 중(이력 복원본)' 안내"
  - "AC7 모든 스냅샷 문자열은 textContent로만 삽입. `<img src=x onerror=alert(1)>` 이 모델명/스킬명에 있어도 문자 그대로 보임"
  - "AC8 숫자는 ko-KR 천 단위 구분, 큰 토큰은 '4,321만' 같은 축약 + 툴팁 정확값. 시각은 브라우저 로컬 시간 + 상대 시간"
mandatory_checks:
  - "node --check test/monitor/app/static/app.js"
  - "node --test test/monitor/tests/ui/   # 최소: null→'미확인'과 0→'0' 구분, 바이트/퍼센트 포맷, 이력 플랜 판정(preflight·historical·24h), null 구간에서 선이 끊기는 SVG 경로, 순수함수 모듈 노출"
  - "실서버 스모크: cd /home/hori/AI/skills/test && SNAPSHOT_PATH=.local/monitor/snapshot.json DB_PATH=/tmp/fe-001.sqlite3 HOST=127.0.0.1 PORT=8790 OTEL_SDK_DISABLED=true .local/monitor-venv/bin/python monitor/app/server.py  (끝나면 종료)  → curl로 /, /static/app.js 200 확인. 가능하면 브라우저 화면 확인"
max_repair_attempts: 2
deliverables:
  - "test/monitor/contracts/results/FE-001.yaml (아래 결과 형식)"
result_format: |
  schema_version: 1
  task_id: FE-001
  status: completed|blocked|failed
  model: "<정확한 모델 id>"
  commit: none
  changed_files: []
  contracts_changed: false   # 계약 변경이 필요하면 true + proposals에 사유, 직접 수정 금지
  proposals: []
  checks: [{name, command, exit_code, passed, failed}]
  acceptance: {AC1: pass|fail|untested, ...}
  blockers: []
  known_risks: []
  log_paths: []
